spring:
  main:
    banner-mode: log
  threads:
    virtual:
      enabled: true
  datasource:
#    url: jdbc:h2:mem:test;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
    url: jdbc:h2:./test;AUTO_SERVER=TRUE
    username: sa
    password:
    driverClassName: org.h2.Driver
#    url: jdbc:postgresql://localhost:5432/postgres
#    driverClassName: org.postgresql.Driver
#    username: user
#    password: password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 5000
  task:
    execution:
      simple:
        concurrency-limit: 32
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        use_sql_comments: true
        format_sql: true
        hql.bulk_id_strategy: org.hibernate.hql.spi.id.inline.InlineIdsOrClauseBulkIdStrategy
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /console
  liquibase:
    enabled: false
    change-log: classpath:/database/changelog/changelog-master.xml
#    drop-first: false
  mustache:
    check-template-location: false
#    enabled: true
  modulith:
    detection-strategy: explicitly-annotated
springdoc:
  swagger-ui:
    display-operation-id: true
server:
  tomcat:
    max-connections: 2000
    accept-count: 100
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"